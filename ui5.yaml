specVersion: "3.0"
metadata:
  name: student-registration
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.uxap
    - name: sap.ui.layout
    - name: sap.ui.comp
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        backend:
          - path: /odata
            url: http://localhost:4004
          - path: /uploadAttachment
            url: http://localhost:4004
          - path: /uploadStudentPicture
            url: http://localhost:4004